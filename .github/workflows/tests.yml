# CI: Run fast tests on every push and PR.
#
# Unit tests: Pure logic tests (log filtering, config layering, profile
#   resolution, host manager, config merge, MCP templates). No network.
#
# MCP tests: Spawn `fnx templates-mcp` over stdio and validate JSON-RPC.
#   Requires templates-mcp build. No host download needed.
#
# E2E tests run separately — see tests-e2e.yml (daily + merge to main).

name: Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install fnx dependencies
        run: npm ci
        working-directory: fnx

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Install templates-mcp dependencies
        run: npm ci
        working-directory: fnx/templates-mcp

      - name: Build templates-mcp
        run: npx tsc -p tsconfig.json
        working-directory: fnx/templates-mcp

      - name: Run unit tests
        shell: bash
        run: node --test tests/unit/*.test.js

  mcp-tests:
    name: MCP Protocol Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install fnx dependencies
        run: npm ci
        working-directory: fnx

      - name: Install templates-mcp dependencies
        run: npm ci
        working-directory: fnx/templates-mcp

      - name: Build templates-mcp
        run: npx tsc -p tsconfig.json
        working-directory: fnx/templates-mcp

      - name: Make fnx executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x fnx/bin/fnx fnx/bin/fnx-template-mcp

      - name: Run MCP protocol tests
        shell: bash
        run: node --test tests/tests-templates-mcp/*.test.js

      - name: Run MCP E2E tests
        shell: bash
        run: node --test tests/e2e/mcp-stdio.test.js tests/e2e/mcp-tools.test.js
