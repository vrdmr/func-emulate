# E2E: Full end-to-end tests including CLI startup, HTTP invocation,
# and trigger registration.
#
# Split into two parallel jobs:
#   - fast: CLI command tests (no host binaries needed) — ~20s
#   - runtime: Actual host start + HTTP invocation (needs warmup) — ~60s
#
# Triggers:
#   - Daily at 06:00 UTC
#   - Manual dispatch (workflow_dispatch)
#   - Push to main (catches regressions on merge)

name: E2E Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # Fast CLI tests — no host download needed, run in parallel
  e2e-fast:
    name: E2E Fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install fnx dependencies
        run: npm ci
        working-directory: fnx

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Install templates-mcp dependencies
        run: npm ci
        working-directory: fnx/templates-mcp

      - name: Build templates-mcp
        run: npx tsc -p tsconfig.json
        working-directory: fnx/templates-mcp

      - name: Make fnx executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x fnx/bin/fnx fnx/bin/fnx-template-mcp

      - name: Run CLI E2E tests (parallel)
        shell: bash
        run: |
          node --test --test-concurrency=4 \
            tests/e2e/doctor.test.js \
            tests/e2e/config-commands.test.js \
            tests/e2e/pack-sync-warmup.test.js \
            tests/e2e/start-logging.test.js \
            tests/e2e/startup-failure.test.js \
            tests/e2e/cross-sku.test.js \
            tests/e2e/verbose-mode.test.js \
            tests/e2e/app-path.test.js

      - name: Run MCP protocol tests (parallel)
        shell: bash
        run: |
          node --test --test-concurrency=3 \
            tests/e2e/mcp-stdio.test.js \
            tests/e2e/mcp-tools.test.js \
            tests/tests-templates-mcp/*.test.js

  # Runtime start tests — need host binaries + Azurite
  e2e-runtime:
    name: E2E Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install fnx dependencies
        run: npm ci
        working-directory: fnx

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Install templates-mcp dependencies
        run: npm ci
        working-directory: fnx/templates-mcp

      - name: Build templates-mcp
        run: npx tsc -p tsconfig.json
        working-directory: fnx/templates-mcp

      - name: Make fnx executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x fnx/bin/fnx fnx/bin/fnx-template-mcp

      - name: Cache fnx host binaries
        uses: actions/cache@v4
        with:
          path: ~/.fnx
          key: fnx-hosts-${{ runner.os }}-${{ hashFiles('fnx/profiles/sku-profiles.json') }}
          restore-keys: fnx-hosts-${{ runner.os }}-

      - name: Warmup — download host binaries and extension bundles
        shell: bash
        run: node fnx/bin/fnx warmup

      - name: Install test app dependencies (Node)
        run: npm install
        working-directory: tests/test-node-app

      - name: Setup Python for test app
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test app dependencies (Python)
        run: pip install -r requirements.txt
        working-directory: tests/test-python-app

      - name: Install Azurite (storage emulator)
        run: npm install -g azurite

      - name: Run runtime start tests
        shell: bash
        run: node --test tests/e2e/runtime-start.test.js

      - name: Run init-start-flow tests
        shell: bash
        run: node --test tests/e2e/init-start-flow.test.js
