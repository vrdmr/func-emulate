# E2E: Full end-to-end tests including CLI startup, HTTP invocation,
# and trigger registration. Downloads host binaries via fnx warmup.
#
# Triggers:
#   - Daily at 06:00 UTC
#   - Manual dispatch (workflow_dispatch)
#   - Push to main (catches regressions on merge)

name: E2E Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install fnx dependencies
        run: npm ci
        working-directory: fnx

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Install templates-mcp dependencies
        run: npm ci
        working-directory: fnx/templates-mcp

      - name: Build templates-mcp
        run: npx tsc -p tsconfig.json
        working-directory: fnx/templates-mcp

      - name: Make fnx executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x fnx/bin/fnx fnx/bin/fnx-template-mcp

      - name: Cache fnx host binaries
        uses: actions/cache@v4
        with:
          path: ~/.fnx
          key: fnx-hosts-${{ runner.os }}-${{ hashFiles('fnx/profiles/sku-profiles.json') }}
          restore-keys: fnx-hosts-${{ runner.os }}-

      - name: Warmup — download host binaries and extension bundles
        shell: bash
        run: node fnx/bin/fnx warmup

      - name: Install test app dependencies (Node)
        run: npm install
        working-directory: tests/test-node-app

      - name: Run all E2E tests
        shell: bash
        run: node --test tests/e2e/*.test.js

      - name: Run MCP protocol tests
        shell: bash
        run: node --test tests/tests-templates-mcp/*.test.js
